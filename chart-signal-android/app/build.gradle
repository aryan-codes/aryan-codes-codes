plugins {
    id "com.android.application"
}

android {
    namespace "com.chartsignal"
    compileSdk 35

    defaultConfig {
        applicationId "com.chartsignal"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.10"
    }

    // One fixed key for every build, so a new APK installs over the previous one.
    // This is a throwaway key for a personal test app, not a release key.
    signingConfigs {
        test {
            storeFile file("../signing/chartsignal-test.keystore")
            storePassword "chartsignal-test"
            keyAlias "chartsignal"
            keyPassword "chartsignal-test"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // on-device text recognition (bundled model, works offline): reads the DEMO/REAL badges and the
    // balance for the demo-only auto-trader
    implementation "com.google.mlkit:text-recognition:16.0.0"
}
